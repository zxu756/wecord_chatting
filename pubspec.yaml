name: wecord
description: "A familiar-social real-time chat app for iOS, macOS, and Web."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.3 <4.0.0"
  flutter: ">=3.38.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: ^2.8.2
  image_picker: ^1.2.2
  flutter_local_notifications: ^21.0.0
  shared_preferences: ^2.5.5
  web: ^1.1.1
  record: ^6.2.0
  just_audio: ^0.10.5
  url_launcher: ^6.3.2
  livekit_client: ^2.13.1
  flutter_webrtc: ^1.6.2+hotfix.4
  webview_flutter: ^4.14.1
  file_selector: ^1.1.0
  video_player: ^2.14.1
  mime: ^2.1.0
  qr_flutter: ^4.1.0
  pdfrx: ^2.6.5
  re_highlight: ^0.0.3
  flutter_markdown_plus: ^1.0.12
  share_plus: ^13.3.1
  gal: ^2.3.3
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: ^2.15.1
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  # Plus Jakarta Sans (SIL OFL 1.1, see assets/fonts/plus_jakarta_sans/OFL.txt),
  # the variable font PlusJakartaSans[wght].ttf from google/fonts: one file covers weights 200–800, and
  # Flutter maps fontWeight onto its wght axis. Chinese falls back to the
  # platform's CJK font (see WeCordTheme.fontFamilyFallback).
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
