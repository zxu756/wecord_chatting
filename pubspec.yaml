name: wecord
description: "A familiar-social real-time chat app for iOS, macOS, and Web."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.5.6
  web: ^1.1.1
  record: ^7.1.2
  just_audio: ^0.10.6
  url_launcher: ^6.3.3
  livekit_client: ^2.13.1
  flutter_webrtc: ^1.6.2+hotfix.4
  # The browser's MediaStreamTrack, for the background blur on the web (was
  # already here through flutter_webrtc).
  dart_webrtc: ^1.8.2
  webview_flutter: ^4.14.1
  file_selector: ^1.1.0
  video_player: ^2.14.1
  mime: ^2.1.0
  qr_flutter: ^4.1.0
  pdfrx: ^2.6.5
  re_highlight: ^0.0.3
  flutter_markdown_plus: ^1.0.12
  share_plus: ^13.3.1
  gal: ^2.3.3
  path_provider: ^2.1.6
  http: ^1.6.0
  crypto: ^3.0.7
  sqflite: ^2.4.4+2
  connectivity_plus: ^7.3.1
  clock: ^1.1.3
  flutter_svg: ^2.3.0
  # Encodes the JPEG of a photo scaled down for sending (was already here
  # through other packages).
  image: ^4.5.4
  # Drop files onto the chat window (macOS and the web).
  desktop_drop: ^0.8.4
  livekit_noise_filter: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.15.1
  video_player_platform_interface: ^6.9.0
  sqflite_common_ffi: ^2.4.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  # Plus Jakarta Sans (SIL OFL 1.1, see assets/fonts/plus_jakarta_sans/OFL.txt),
  # the variable font PlusJakartaSans[wght].ttf from google/fonts: one file covers weights 200–800, and
  # Flutter maps fontWeight onto its wght axis. Chinese falls back to the
  # platform's CJK font (see WeCordTheme.fontFamilyFallback).
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
    # JetBrains Mono (SIL OFL 1.1, see assets/fonts/jetbrains_mono/OFL.txt),
    # JetBrainsMono[wght].ttf from google/fonts: code and plain text in the
    # file viewer, the same on every platform.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Variable.ttf
