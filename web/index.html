<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Phone-width layout before Flutter starts; Flutter then installs the
       same viewport settings itself. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="WeCord: chat with friends, groups and circles in real time.">
  <!-- Browser toolbar colour, matching WeCordTheme's background. -->
  <meta name="theme-color" content="#F7F8FA">

  <!-- iOS meta tags & icons. The default status bar style keeps the page
       below the status bar, so the app needs no extra top inset on web. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WeCord">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicons, drawn by tool/generate_web_icons.py. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>

  <!-- What LiveKit's background blur imports when it is first used (see
       lib/features/voice/background/video_background_web.dart): a logger
       stand-in for livekit-client, and MediaPipe's pinned vision bundle. -->
  <script type="importmap">
  {
    "imports": {
      "livekit-client": "./blur/livekit_client_shim.js",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
    }
  }
  </script>

  <title>WeCord - chat with friends, groups and circles</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Avoids a white flash and rubber-band gaps around the app on phones. */
    html, body { background-color: #F7F8FA; overscroll-behavior: none; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
